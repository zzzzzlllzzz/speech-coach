services:
  - type: web
    name: speech-coach-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: USE_MOCK
        value: false
      - key: WHISPER_MODEL
        value: base
      - key: WHISPER_TIMEOUT_SECONDS
        value: 35
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: speech-coach
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://speech-coach-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
